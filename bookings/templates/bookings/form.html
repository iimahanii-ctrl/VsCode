<!DOCTYPE html>
<html>
<head>
    <title>Book a Lesson</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        form { max-width: 500px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #333; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Book a Lesson with Mrs. Ghorbani</h1>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Book Now</button>
    </form>
</body>
</html>
